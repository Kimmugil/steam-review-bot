name: Steam Review Analysis

on:
  repository_dispatch:
    types: [trigger-analysis]
  workflow_dispatch:
    inputs:
      appId:
        description: 'Steam App ID'
        required: true
      uuid:
        description: 'Analysis Round UUID'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Analysis Script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_MASTER_ID: ${{ secrets.GOOGLE_SHEETS_MASTER_ID }}
        run: |
          # Use github.event.client_payload for repository_dispatch, or github.event.inputs for workflow_dispatch
          APP_ID="${{ github.event.client_payload.appId || github.event.inputs.appId }}"
          UUID="${{ github.event.client_payload.uuid || github.event.inputs.uuid }}"
          echo "Running analysis for $APP_ID (UUID: $UUID)"
          npx tsx scripts/run_analysis.ts "$APP_ID" "$UUID"
